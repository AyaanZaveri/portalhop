name: Android debug APK

# Builds the same debug APK as `npm run android:build -- --debug` locally, and
# attaches it to the run so it can be downloaded without a local Android
# toolchain. Debug rather than release because a release APK is unsigned and
# Android refuses to install it; the debug one is signed with the standard
# debug key and installs straight away.
on:
  push:
    branches: [master]
  # So a build can be kicked off without pushing.
  workflow_dispatch:

# A push and a manual run landing together left two builds competing for a
# runner, and one would be cancelled seemingly at random. Superseding the older
# run makes that deliberate, and the newer commit is the one worth building.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # To attach the APK to a release, so it can be downloaded as a plain file.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      # bun, not npm: bun.lock is the lockfile that is actually maintained here
      # (Capacitor was installed with it) and package-lock.json has since
      # fallen behind, so npm would resolve a different dependency tree.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"

      # Gradle and the Android plugin need a JDK they support; the runner's
      # default is newer than this project builds against.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      # Matches compileSdkVersion/targetSdkVersion in android/variables.gradle.
      # No NDK: Capacitor's Android project is Java and Kotlin only.
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Runs the static Next.js export, `cap sync`, and Gradle — the same script
      # used locally, so CI can't drift from what is tested on a device.
      - name: Build debug APK
        env:
          # These come from .env locally, which is gitignored and so absent
          # here. Without them CI silently produced a different build: a missing
          # proxy URL left the player unable to construct a stream URL at all.
          # NEXT_PUBLIC_* values are compiled into the client bundle and shipped
          # to every user, so they are repository variables rather than secrets.
          NEXT_PUBLIC_PROXY_URL: ${{ vars.NEXT_PUBLIC_PROXY_URL }}
          NEXT_PUBLIC_MUX_ENV_KEY: ${{ vars.NEXT_PUBLIC_MUX_ENV_KEY }}
        run: node scripts/build-android-apk.mjs --debug

      # Kept for per-run history. GitHub always serves artifacts as a zip, which
      # is why the release below exists.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: portal-hop-debug-apk
          path: dist-android/*.apk
          if-no-files-found: error

      # A release asset downloads as the file itself, so the APK can be tapped
      # and installed straight from a phone with no unzipping.
      - name: Publish APK to the rolling debug release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: Latest debug build
          body: >
            Debug APK built from ${{ github.sha }}.
            Replaced on every push to master.
          prerelease: true
          make_latest: false
          files: dist-android/*.apk
